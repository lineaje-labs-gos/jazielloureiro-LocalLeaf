[build-system]
requires = [
    "flit",
]
build-backend = "flit.buildapi"

[project]
name = "localleaf"
readme = "README.md"
requires-python = ">=3"
authors = [
    { name = "Jaziel Loureiro", email = "jazielloureiro17@gmail.com" },
    { name = "Moritz Glöckl", email = "moritzgloeckl@users.noreply.github.com" },
]
maintainers = [
    { name = "Lineaje DepFixer", email = "221268890+Lineaje-DepFixer@users.noreply.github.com" },
]
keywords = [
    "overleaf",
    "local",
    "sync",
    "latex",
    "tex",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "beautifulsoup4==4.11.1",
    "certifi==2024.8.30",
    "charset-normalizer==3.4.0",
    "click==8.1.7",
    "idna==3.10",
    "PySide6==6.8.0.2",
    "PySide6_Addons==6.8.0.2",
    "PySide6_Essentials==6.8.0.2",
    "python-dateutil==2.8.2",
    "requests==2.32.3",
    "shiboken6==6.8.0.2",
    "six==1.16.0",
    "socketIO-client==0.5.7.2",
    "soupsieve==2.6",
    "urllib3==2.2.3",
    "websocket-client==1.8.0",
]
dynamic = [
    "description",
]
version = "1.1.1+lineaje.1"

[project.license]
file = "LICENSE"

[project.urls]
Source = "https://github.com/jazielloureiro/LocalLeaf"
Homepage = "https://github.com/lineaje-labs-gos/jazielloureiro-LocalLeaf"
Repository = "https://github.com/lineaje-labs-gos/jazielloureiro-LocalLeaf"
Tracker = "https://github.com/lineaje-labs-gos/jazielloureiro-LocalLeaf/issues"

[project.scripts]
lleaf = "localleaf.cli:cli"
